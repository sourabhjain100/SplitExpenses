<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Expenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800;900&family=JetBrains+Mono:wght=600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

        tailwind.config = {

                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { primary: '#4F46E5', secondary: '#F59E0B', dark: '#1E293B' }

    <style>
        body { background-color: #F1F5F9; color: #334155; }
        .soft-card { background: white; border-radius: 16px; box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.03); border: 1px solid rgba(255,255,255,0.8); }
        .chip { border-radius: 10px; transition: all 0.15s ease; border: 1px solid #E2E8F0; }
        .chip.active { background: #4F46E5; color: white; border-color: #4F46E5; }
        .chip.inactive { background: white; color: #94A3B8; }
        .expandable { transition: all 0.2s ease-out; max-height: 0; overflow: hidden; }
        .expanded { max-height: 1000px; padding-top: 8px; margin-top: 8px; border-top: 1px solid #F1F5F9; }
        .nav-btn { border-radius: 12px; transition: all 0.15s; font-weight: 700; }
        .nav-btn:active { transform: scale(0.98); }
        .input-box { width: 100%; padding: 0.6rem 0.8rem; background: #F8FAFC; border: 2px solid transparent; border-radius: 12px; font-weight: 500; outline: none; transition: all 0.15s; }
        .input-box:focus { background: white; border-color: #4F46E5; }
        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding-top: 6px; padding-bottom: 6px; }
        .tab-btn.active { color: #4F46E5; border-color: #4F46E5; font-weight: 800; }
        #validation-banner { position: fixed; top: -100px; left: 0; right: 0; z-index: 100; transition: top 0.3s; }
        #validation-banner.show { top: 0; }
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); z-index: 100; transition: bottom 0.3s; }
        #toast.show { bottom: 20px; }
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        #modal-overlay.show { display: flex; }
        [contenteditable="true"]:empty:before { content: attr(placeholder); color: #94A3B8; font-weight: 600; }
    </style>
</head>
<body class="font-sans antialiased text-sm">

    <span id="banner-text">Error</span>
</div>

<div id="toast" class="px-6 py-2.5 bg-dark text-white font-700 text-[11px] uppercase tracking-widest rounded-full shadow-xl flex items-center gap-2">
    <span id="toast-text">Success</span>
</div>

<div id="modal-overlay">

        <p id="modal-desc" class="text-slate-500 font-medium leading-normal"></p>
        <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2 font-700 uppercase text-slate-400">Cancel</button>
            <button id="modal-confirm-btn" class="flex-1 py-2 bg-rose-500 text-white rounded-xl font-800 uppercase nav-btn">Confirm</button>

</div>

<div id="canvas-scratchpad" class="absolute left-[-9999px] top-0 w-[375px] flex flex-col p-3 space-y-2.5 bg-[#F1F5F9]"></div>

    <div id="pane-setup" class="space-y-3">

            <div id="split-details" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>
            <button id="submit-btn" onclick="saveExpense()" class="w-full nav-btn bg-dark text-white py-2.5 text-[11px] font-800 uppercase tracking-widest shadow-md">Save Transaction</button>
        </section>
    </div>

    <div id="pane-history" class="space-y-3 hidden">
        <div id="transactions-wrapper" class="px-1">
            <label id="transactions-label" class="text-[11px] font-800 text-slate-400 uppercase tracking-widest mb-2 block">Transactions Ledger</label>
            <div id="transaction-body" class="space-y-2 pb-12"></div>
        </div>
    </div>

    <div id="pane-summary" class="space-y-3 hidden">
        <section id="unified-metrics-card" class="soft-card p-3 bg-white space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <div class="text-left">
                    <p class="text-[10px] font-800 text-slate-400 uppercase tracking-widest">Total Group Expense</p>
                    <p id="total-group-amount" class="text-2xl font-mono font-900 text-dark">$0.00</p>
                </div>
                <div class="flex gap-1.5 relative" data-html2canvas-ignore id="download-dropdown-wrapper">
                    <button onclick="toggleDownloadMenu()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-800 py-1.5 px-3 rounded-full uppercase transition-colors shadow-sm flex items-center gap-1">
                        Download
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="download-menu" class="hidden absolute right-0 top-8 mt-1 w-24 bg-white rounded-lg shadow-xl z-50 border border-slate-100 overflow-hidden">
                        <button onclick="exportToJPG(); toggleDownloadMenu()" class="w-full text-left px-3 py-2 text-[10px] font-800 text-slate-600 hover:bg-slate-50 hover:text-primary uppercase border-b border-slate-50 transition-colors">Image</button>
                        <button onclick="exportToCSV(); toggleDownloadMenu()" class="w-full text-left px-3 py-2 text-[10px] font-800 text-slate-600 hover:bg-slate-50 hover:text-primary uppercase transition-colors">CSV</button>
                    </div>
                </div>
            </div>
            
            <div class="space-y-0 border border-slate-200 rounded-lg overflow-hidden bg-slate-50/50 font-sans">
                <div class="grid grid-cols-[1.3fr_1fr_1fr_1fr] gap-0 bg-slate-100/80 border-b border-slate-200 text-[10px] font-800 text-slate-500 uppercase tracking-wider text-right py-2">
                    <span class="text-left px-2 border-r border-slate-200/60">Member</span>
                    <span class="px-1 border-r border-slate-200/60">Spent</span>
                    <span class="px-1 border-r border-slate-200/60">Owed</span>
                    <span class="px-2">Net</span>
                </div>
                <div id="member-table-rows" class="space-y-0 bg-white divide-y divide-slate-100"></div>
            </div>
        </section>

        <section id="settlement-card" class="soft-card p-3 space-y-2 bg-indigo-50/40 border-indigo-100 border">
            <div class="flex justify-between items-center border-b border-indigo-100/40 pb-1.5">
                <label class="text-[10px] font-800 text-primary uppercase tracking-widest block">Settlement Strategy</label>
                <select id="strategy-selector" onchange="renderWithSelectedStrategy()" class="bg-white border border-slate-200 rounded-lg px-2 py-0.5 text-[10px] font-800 uppercase tracking-wide text-slate-600 outline-none">
                </select>
            </div>
            <div id="settlement-list" class="space-y-1"></div>
        </section>
    </div>

    <div id="pane-settings" class="space-y-3 hidden">
        <section class="soft-card p-3 space-y-3">
            <div>
                <label class="text-[10px] font-800 uppercase tracking-widest text-slate-400 mb-1 block">Group Title</label>
                <div class="flex items-center gap-1 w-full border-b border-slate-200 pb-1">
                    <h1 id="display-group-name" contenteditable="true" onblur="updateGroupName()" placeholder="Enter Title" class="text-base font-800 tracking-tight text-dark outline-none truncate pr-1 flex-1"></h1>
                    <svg class="w-3.5 h-3.5 text-slate-400 shrink-0 select-none pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                    </svg>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-800 uppercase tracking-widest text-slate-400 mb-1 block">Currency</label>
                <select id="currency-selector" onchange="updateCurrencySetting()" class="input-box py-2 text-[11px] font-700 bg-white border-slate-200">
                    <option value="$">USD ($)</option>
                    <option value="₹">INR (₹)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                </select>
            </div>
            
            <div>
                <label class="text-[10px] font-800 uppercase tracking-widest text-slate-400 mb-1 block">Add Member</label>
                <div class="flex gap-1">
                    <input id="new-member-name" type="text" placeholder="Add Name" class="input-box text-sm py-2">
                    <button id="add-member-btn" onclick="addMember()" class="bg-primary text-white px-4 py-2 rounded-xl font-800 uppercase nav-btn shadow-md shadow-indigo-50">Add</button>
                </div>

            <div>
                <label class="text-[10px] font-800 uppercase tracking-widest text-slate-400 mb-1 block">Group Members (Tap to Edit/Delete)</label>
                <div id="settings-member-badges" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-slate-100" data-html2canvas-ignore>
                <button onclick="loadTestData()" class="flex-1 bg-slate-700 hover:bg-slate-800 text-white text-[10px] font-800 py-2 rounded-xl uppercase transition-colors shadow-sm tracking-wider">Load Test Data</button>
                <button onclick="confirmClear()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-800 py-2 rounded-xl uppercase transition-colors shadow-sm tracking-wider">Reset All</button>
            </div>
        </section>
    </div>
</div>

<script>
    const STORAGE_KEY = 'split_pro_v44_soft';
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { groupName: '', people: [], expenses: [], currency: '$' };
    if (!state.currency) state.currency = '$';
    
    let participants = [];
    let expandedId = null;
    let activeTab = 'setup';
    let currentSelectedStrategyKey = 'option1';
    let editingMemberName = null;

    function switchTab(tabId) {
        activeTab = tabId;
        ['setup', 'history', 'summary', 'settings'].forEach(t => {
            document.getElementById(`tab-${t}`).classList.remove('active');
            document.getElementById(`pane-${t}`).classList.add('hidden');
        });
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`pane-${tabId}`).classList.remove('hidden');
    }

    function showBanner(msg) {
        const b = document.getElementById('validation-banner');
        document.getElementById('banner-text').innerText = msg;
        b.classList.add('show');
        setTimeout(() => b.classList.remove('show'), 2500);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toast-text').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function confirmHighRisk(desc, action) {
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('modal-overlay').classList.add('show');
        document.getElementById('modal-confirm-btn').onclick = () => { action(); closeModal(); };
    }

    function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

    function updateGroupName() { 
        const headerEl = document.getElementById('display-group-name');
        state.groupName = headerEl.innerText.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); 
        updateTopBarTitle();
    }

    function updateTopBarTitle() {
        document.getElementById('top-bar-title').innerText = state.groupName || 'Group Expenses';
    }

    function updateCurrencySetting() {
        state.currency = document.getElementById('currency-selector').value;
        document.getElementById('currency-symbol-indicator').innerText = state.currency;
        saveAndRefresh();
        showToast("Currency Updated");
    }

    function formatDate(dateStr) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        if (!dateStr) return "24 May 2026";
        const [y, m, d] = dateStr.split('-');
        return `${d.padStart(2, '0')} ${months[parseInt(m)-1]} ${y}`;
    }

    function calculateBalances() {
        let balances = {}; state.people.forEach(p => balances[p] = 0);
        state.expenses.forEach(e => {
            balances[e.payer] += e.amount;
            Object.entries(e.breakdown).forEach(([name, share]) => { if(balances.hasOwnProperty(name)) balances[name] -= share; });
        });
        return balances;
    }

    function runStrategyEngine(strategyKey, balances) {
        let plan = [];
        let debtors = [], creditors = [];
        Object.entries(balances).forEach(([name, amount]) => {
            let rounded = Math.round(amount * 100) / 100;
            if (rounded < -0.01) debtors.push({ name, amount: Math.abs(rounded) });
            else if (rounded > 0.01) creditors.push({ name, amount: rounded });
        });

        if (strategyKey === 'option1') {
            for (let i = 0; i < debtors.length; i++) {
                if (debtors[i].amount < 0.01) continue;
                for (let j = 0; j < creditors.length; j++) {
                    if (creditors[j].amount < 0.01) continue;
                    if (Math.abs(debtors[i].amount - creditors[j].amount) < 0.01) {
                        plan.push({ from: debtors[i].name, to: creditors[j].name, amount: debtors[i].amount });
                        debtors[i].amount = 0;
                        creditors[j].amount = 0;
                        break;
                    }
                }
            }

            creditors.sort((a, b) => a.amount - b.amount);
            for (let j = 0; j < creditors.length; j++) {
                if (creditors[j].amount < 0.01) continue;
                debtors.sort((a, b) => b.amount - a.amount);
                for (let i = 0; i < debtors.length; i++) {
                    if (debtors[i].amount >= creditors[j].amount - 0.005) {
                        plan.push({ from: debtors[i].name, to: creditors[j].name, amount: creditors[j].amount });
                        debtors[i].amount -= creditors[j].amount;
                        creditors[j].amount = 0;
                        break;
                    }
                }
            }

            creditors.sort((a, b) => b.amount - a.amount);
            debtors.sort((a, b) => b.amount - a.amount);
            for (let i = 0; i < debtors.length; i++) {
                if (debtors[i].amount < 0.01) continue;
                for (let j = 0; j < creditors.length; j++) {
                    if (creditors[j].amount < 0.01) continue;
                    
                    let potentialPay = Math.min(debtors[i].amount, creditors[j].amount);
                    if (potentialPay < 5.00) {
                        let totalDebtLeft = debtors.reduce((s, d) => s + d.amount, 0);
                        if (totalDebtLeft > 5.00) continue; 
                    }
                    
                    plan.push({ from: debtors[i].name, to: creditors[j].name, amount: potentialPay });
                    debtors[i].amount -= potentialPay;
                    creditors[j].amount -= potentialPay;
                    if (debtors[i].amount < 0.01) break;
                }
            }

            let loops = 0;
            while (loops < 200) {
                debtors.sort((a, b) => b.amount - a.amount);
                creditors.sort((a, b) => b.amount - a.amount);
                let activeDebtor = debtors.find(d => d.amount > 0.01);
                let activeCreditor = creditors.find(c => c.amount > 0.01);
                if (!activeDebtor || !activeCreditor) break;
                
                let finalPay = Math.min(activeDebtor.amount, activeCreditor.amount);
                plan.push({ from: activeDebtor.name, to: activeCreditor.name, amount: finalPay });
                activeDebtor.amount -= finalPay;
                activeCreditor.amount -= finalPay;
                loops++;
            }

        } else if (strategyKey === 'option2') {
            creditors.sort((a, b) => b.amount - a.amount);
            for (let j = 0; j < creditors.length; j++) {
                if (creditors[j].amount < 0.01) continue;
                debtors.sort((a, b) => b.amount - a.amount);
                for (let i = 0; i < debtors.length; i++) {
                    if (debtors[i].amount >= creditors[j].amount) {
                        plan.push({ from: debtors[i].name, to: creditors[j].name, amount: creditors[j].amount });
                        debtors[i].amount -= creditors[j].amount;
                        creditors[j].amount = 0;
                        break;
                    }
                }
            }
            let i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                if (debtors[i].amount < 0.01) { i++; continue; }
                if (creditors[j].amount < 0.01) { j++; continue; }

                let payAmount = Math.min(debtors[i].amount, creditors[j].amount);
                plan.push({ from: debtors[i].name, to: creditors[j].name, amount: payAmount });
                debtors[i].amount -= payAmount;
                creditors[j].amount -= payAmount;
                if (debtors[i].amount < 0.01) i++;
                if (creditors[j].amount < 0.01) j++;
            }

        } else if (strategyKey === 'option3') {
            for (let i = 0; i < debtors.length; i++) {
                for (let j = 0; j < creditors.length; j++) {
                    if (Math.abs(debtors[i].amount - creditors[j].amount) < 0.01 && debtors[i].amount > 0) {
                        plan.push({ from: debtors[i].name, to: creditors[j].name, amount: debtors[i].amount });
                        debtors[i].amount = 0;
                        creditors[j].amount = 0;
                    }
                }
            }
            debtors.sort((a, b) => b.amount - a.amount);
            creditors.sort((a, b) => b.amount - a.amount);
            let i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                if (debtors[i].amount < 0.01) { i++; continue; }
                if (creditors[j].amount < 0.01) { j++; continue; }

                let payAmount = Math.min(debtors[i].amount, creditors[j].amount);
                plan.push({ from: debtors[i].name, to: creditors[j].name, amount: payAmount });
                debtors[i].amount -= payAmount;
                creditors[j].amount -= payAmount;
                if (debtors[i].amount < 0.01) i++;
                if (creditors[j].amount < 0.01) j++;
            }

        } else if (strategyKey === 'option4') {
            if (state.people.length > 0) {
                let sortedPeople = [...state.people].sort((a, b) => (balances[b] || 0) - (balances[a] || 0));
                let hub = sortedPeople[0];
                Object.entries(balances).forEach(([name, amount]) => {
                    if (name === hub) return;
                    let rounded = Math.round(amount * 100) / 100;
                    if (rounded < -0.01) plan.push({ from: name, to: hub, amount: Math.abs(rounded) });
                    else if (rounded > 0.01) plan.push({ from: hub, to: name, amount: rounded });
                });
            }
        }

        return plan.filter(p => p.amount > 0.01);
    }

    function getPlanFingerprint(plan) {
        let sortedTransfers = plan.map(p => `${p.from}->${p.to}:${p.amount.toFixed(2)}`).sort();
        return sortedTransfers.join('|');
    }

    function calculateSettlements(balances) {
        const totalOptions = ['option1', 'option2', 'option3', 'option4'];
        let outcomeMap = {};
        let distinctOptions = [];

        totalOptions.forEach(opt => {
            let plan = runStrategyEngine(opt, balances);
            let fingerprint = getPlanFingerprint(plan);
            if (!outcomeMap.hasOwnProperty(fingerprint)) {
                outcomeMap[fingerprint] = opt;
                distinctOptions.push(opt);
            }
        });

        const selector = document.getElementById('strategy-selector');
        if (selector) {
            let labelIndex = 1;
            let optionsHTML = distinctOptions.map(opt => {
                let isSelected = opt === currentSelectedStrategyKey ? 'selected' : '';
                return `<option value="${opt}" ${isSelected}>OPTION ${labelIndex++}</option>`;
            }).join('');
            
            selector.innerHTML = optionsHTML;
            if (!distinctOptions.includes(currentSelectedStrategyKey) && distinctOptions.length > 0) {
                currentSelectedStrategyKey = distinctOptions[0];
                if(selector) selector.value = currentSelectedStrategyKey;
            }
        }

        return runStrategyEngine(currentSelectedStrategyKey, balances);
    }

    function renderWithSelectedStrategy() {
        const selector = document.getElementById('strategy-selector');
        if (selector) {
            currentSelectedStrategyKey = selector.value;
        }
        render();
    }

    function saveExpense() {
        const editId = document.getElementById('edit-id').value;
        const desc = document.getElementById('desc').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const payer = document.getElementById('payer-select').value;
        const rawDate = document.getElementById('trans-date').value;
        if (!desc || isNaN(amount) || amount <= 0 || !payer || participants.length === 0) return showBanner("Check fields");

        const mode = document.getElementById('split-mode').value;
        let breakdown = {}; state.people.forEach(p => breakdown[p] = 0);
        if (mode === 'even') { const sh = amount / participants.length; participants.forEach(p => breakdown[p] = sh); }
        else {
            const inputs = document.querySelectorAll('.split-input');
            inputs.forEach(i => {
                const val = parseFloat(i.value) || 0; const p = i.dataset.person;
                if (mode === 'exact') breakdown[p] = val;
                if (mode === 'percent') breakdown[p] = (val/100) * amount;
                if (mode === 'share') { let total = Array.from(inputs).reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0); breakdown[p] = total ? (val/total) * amount : 0; }
                if (mode === 'adjustment') breakdown[p] = (amount/participants.length) + val;
            });
        }
        const entry = { id: editId ? parseFloat(editId) : Date.now(), desc, amount, payer, date: formatDate(rawDate), rawDate, mode, breakdown, participants: [...participants] };
        if (editId) { state.expenses[state.expenses.findIndex(e => e.id == editId)] = entry; showToast("Updated"); }
        else { state.expenses.push(entry); showToast("Saved"); }
        resetForm(); saveAndRefresh();
        switchTab('history');
    }

    function deleteExpense(id) {
        confirmHighRisk("Delete entry?", () => {
            state.expenses = state.expenses.filter(e => e.id !== id);
            saveAndRefresh();
            showToast("Deleted");
        });
    }

    function confirmClear() {
        confirmHighRisk("Clear all configurations?", () => {
            state = { groupName: '', people: [], expenses: [], currency: '$' };
            editingMemberName = null;
            resetMemberInputRow();
            saveAndRefresh();
            document.getElementById('currency-selector').value = '$';
            document.getElementById('currency-symbol-indicator').innerText = '$';
            showToast("Cleared");
        });
    }

    function loadTestData() {
        const members = ['Alex', 'Sam', 'Riley', 'Jordan', 'Taylor', 'Casey'];
        const transactions = [
            { d: 'Gas Station', a: 65.50 }, { d: 'Hotel Booking', a: 450.00 }, { d: 'Dinner Party', a: 185.00 },
            { d: 'Museum Tickets', a: 120.00 }, { d: 'Grocery Run', a: 95.20 }, { d: 'Highway Tolls', a: 22.00 },
            { d: 'Coffee & Snacks', a: 34.50 }, { d: 'Parking Fee', a: 15.00 }, { d: 'Ice Cream Shop', a: 40.80 }, { d: 'Boat Rental', a: 300.00 }
        ];
        state.people = [...members]; 
        state.expenses = [];
        transactions.forEach((t, i) => {
            let bd = {}; members.forEach(m => bd[m] = t.a / 6);
            state.expenses.push({
                id: Date.now() + i, desc: t.d, amount: t.a, payer: members[i % 6],
                date: "16 May 2026", rawDate: "2026-05-16", mode: 'even',
                breakdown: bd, participants: [...members]
            });
        });
        participants = [...members]; 
        editingMemberName = null;
        resetMemberInputRow();
        saveAndRefresh();
        showToast("10 records added");
    }

    function toggleDownloadMenu() {
        document.getElementById('download-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        const wrapper = document.getElementById('download-dropdown-wrapper');
        const menu = document.getElementById('download-menu');
        if (wrapper && menu && !wrapper.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });

    async function exportToJPG() {
        const scratch = document.getElementById('canvas-scratchpad');
        const prefix = (state.groupName || "Split_Expenses").replace(/\s+/g, '_');
        const cleanTitleName = state.groupName || "Group";
        const cur = state.currency;
        
        const triggerDownload = (canvas, filename) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        };

        scratch.innerHTML = '';
        const headClone = document.getElementById('main-header').cloneNode(true);
        const mainTitle = headClone.querySelector('#top-bar-title');
        if (mainTitle) mainTitle.innerText = cleanTitleName;
        scratch.appendChild(headClone);
        
        const summaryClone = document.getElementById('unified-metrics-card').cloneNode(true);
        const strategyClone = document.getElementById('settlement-card').cloneNode(true);
        scratch.appendChild(summaryClone);
        scratch.appendChild(strategyClone);
        
        const summaryCanvas = await html2canvas(scratch, { scale: 2, backgroundColor: '#F1F5F9' });
        triggerDownload(summaryCanvas, `${prefix}_Dashboard_Summary.jpg`);

        const chronicEntries = state.expenses.slice().reverse();
        if (chronicEntries.length === 0) {
            showToast("Snapshots Exported");
            return;
        }

        let maxPerChunk = 4;
        if (state.people.length > 12) maxPerChunk = 1;
        else if (state.people.length > 6) maxPerChunk = 2;
        else if (state.people.length > 4) maxPerChunk = 3;

        const totalChunks = Math.ceil(chronicEntries.length / maxPerChunk);
        
        for (let idx = 0; idx < chronicEntries.length; idx += maxPerChunk) {
            scratch.innerHTML = '';
            const chunkHead = document.getElementById('main-header').cloneNode(true);
            const chunkTitle = chunkHead.querySelector('#top-bar-title');
            if (chunkTitle) {
                const chunkNumber = Math.floor(idx / maxPerChunk) + 1;
                chunkTitle.innerText = `${cleanTitleName} • Expense (${chunkNumber}/${totalChunks})`;
            }
            scratch.appendChild(chunkHead);

            const wrapBox = document.createElement('div');
            wrapBox.className = 'space-y-2 pb-2';
            const sliceChunk = chronicEntries.slice(idx, idx + maxPerChunk);
            
            sliceChunk.forEach(e => {
                const card = document.createElement('div');
                card.className = 'soft-card p-3 bg-white space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 w-full">
                        <h4 class="font-800 text-sm text-dark uppercase break-words flex-1">${e.desc}</h4>
                        <span class="font-mono font-700 text-dark text-sm shrink-0">${cur}${e.amount.toFixed(2)}</span>
                    </div>
                    <div class="text-[10px] font-700 text-slate-400 uppercase pb-1 border-b border-slate-100">
                        ${e.date} • Paid by ${e.payer}
                    </div>
                    <div class="space-y-0.5 pt-1">
                        ${Object.entries(e.breakdown).filter(([_, v]) => v !== 0).map(([n, v]) => `
                            <div class="flex justify-between text-[11px] font-700 text-slate-500 uppercase py-0.5">
                                <span>${n}</span>
                                <span class="font-mono">${cur}${v.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                wrapBox.appendChild(card);
            });
            
            scratch.appendChild(wrapBox);
            const ledgerCanvas = await html2canvas(scratch, { scale: 2, backgroundColor: '#F1F5F9' });
            const chunkFileIndex = Math.floor(idx / maxPerChunk) + 1;
            triggerDownload(ledgerCanvas, `${prefix}_Ledger_Part_${chunkFileIndex}.jpg`);
        }

        scratch.innerHTML = '';
        showToast("Snapshots Exported");
    }

    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,";
        
        csvContent += `Group,${state.groupName || 'Group Expenses'}\n\n`;
        
        csvContent += "--- EXPENSE DETAILS ---\n";
        let expenseHeaders = ["Date", "Description", "Payer", "Total Amount"];
        state.people.forEach(p => expenseHeaders.push(`${p} Share`));
        csvContent += expenseHeaders.map(h => `"${h}"`).join(",") + "\n";
        
        state.expenses.forEach(e => {
            let row = [
                e.date,
                e.desc.replace(/"/g, '""'),
                e.payer,
                e.amount.toFixed(2)
            ];
            state.people.forEach(p => {
                row.push((e.breakdown[p] || 0).toFixed(2));
            });
            csvContent += row.map(v => `"${v}"`).join(",") + "\n";
        });
        
        csvContent += "\n--- SETTLEMENT PLAN ---\n";
        let balances = calculateBalances();
        let plan = calculateSettlements(balances);
        csvContent += '"From","To","Amount"\n';
        if (plan.length === 0) {
            csvContent += '"No Debts","",""\n';
        } else {
            plan.forEach(p => {
                csvContent += `"${p.from}","${p.to}","${p.amount.toFixed(2)}"\n`;
            });
        }
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        const prefix = (state.groupName || "Split_Expenses").replace(/\s+/g, '_');
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `${prefix}_Data.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast("CSV Downloaded");
    }

    function addMember() {
        const inputEl = document.getElementById('new-member-name');
        const name = inputEl.value.trim();
        if (!name) return showBanner("Invalid name");

        if (editingMemberName) {
            if (name !== editingMemberName && state.people.includes(name)) return showBanner("Name already exists");
            
            const idx = state.people.indexOf(editingMemberName);
            if (idx !== -1) {
                state.people[idx] = name;
                
                state.expenses.forEach(e => {
                    if (e.payer === editingMemberName) e.payer = name;
                    if (e.participants) {
                        const pIdx = e.participants.indexOf(editingMemberName);
                        if (pIdx !== -1) e.participants[pIdx] = name;
                    }
                    if (e.breakdown && e.breakdown.hasOwnProperty(editingMemberName)) {
                        e.breakdown[name] = e.breakdown[editingMemberName];
                        delete e.breakdown[editingMemberName];
                    }
                });

                const partIdx = participants.indexOf(editingMemberName);
                if (partIdx !== -1) participants[partIdx] = name;

                showToast(`Renamed to ${name}`);
            }
            editingMemberName = null;
        } else {
            if (state.people.includes(name)) return showBanner("Name already exists");
            state.people.push(name);
            participants.push(name);
            showToast(`${name} Added`);
        }

        resetMemberInputRow();
        saveAndRefresh();
    }

    function editMemberBadge(name) {
        editingMemberName = name;
        const inputEl = document.getElementById('new-member-name');
        inputEl.value = name;
        inputEl.focus();
        
        const btn = document.getElementById('add-member-btn');
        btn.innerText = "Update";
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-amber-500');
    }

    function deleteMemberBadge(name) {
        confirmHighRisk(`Delete ${name} and related balances?`, () => {
            state.people = state.people.filter(p => p !== name);
            participants = participants.filter(p => p !== name);
            
            state.expenses.forEach(e => {
                if (e.participants) e.participants = e.participants.filter(p => p !== name);
                if (e.breakdown && e.breakdown.hasOwnProperty(name)) delete e.breakdown[name];
            });

            if (editingMemberName === name) {
                editingMemberName = null;
                resetMemberInputRow();
            }

            saveAndRefresh();
            showToast(`${name} Removed`);
        });
    }

    function resetMemberInputRow() {
        document.getElementById('new-member-name').value = '';
        const btn = document.getElementById('add-member-btn');
        btn.innerText = "Add";
        btn.classList.remove('bg-amber-500');
        btn.classList.add('bg-primary');
    }

    function saveAndRefresh() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); render(); updateSplitUI(); }

    function updateSplitUI() {
        const mode = document.getElementById('split-mode').value;
        const total = parseFloat(document.getElementById('amount').value) || 0;
        const cur = state.currency;
        document.getElementById('people-toggle-list').innerHTML = state.people.map(p => `<button onclick="toggleParticipant('${p}')" class="chip px-2.5 py-1 text-[11px] font-700 uppercase ${participants.includes(p) ? 'active' : 'inactive'}">${p}</button>`).join('');
        const container = document.getElementById('split-details');
        if (mode === 'even') container.innerHTML = `<div class="p-2 bg-slate-50 rounded-xl text-[10px] font-bold text-slate-400 text-center uppercase">${cur}${(total / (participants.length || 1)).toFixed(2)} each</div>`;
        else container.innerHTML = participants.map(p => `
            <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg">
                <span class="text-[12px] font-700 text-slate-600 uppercase">${p}</span>
                <div class="flex items-center gap-0.5">
                    <span class="font-mono text-slate-400 font-bold text-xs">${mode === 'exact' || mode === 'adjustment' ? cur : ''}</span>
                    <input type="number" data-person="${p}" class="split-input w-16 text-right font-mono font-bold bg-transparent border-b border-slate-200 outline-none text-sm">
                    <span class="font-mono text-slate-400 font-bold text-xs">${mode === 'percent' ? '%' : mode === 'share' ? 'x' : ''}</span>
                </div>
            </div>`).join('');
    }

    function toggleParticipant(name) {
        if (participants.includes(name)) { if (participants.length > 1) participants = participants.filter(p => p !== name); }
        else participants.push(name);
        updateSplitUI();
    }

    function resetForm() {
        document.getElementById('edit-id').value = ''; document.getElementById('desc').value = ''; document.getElementById('amount').value = '';
        document.getElementById('form-title').innerText = "Transaction Details"; document.getElementById('cancel-edit').classList.add('hidden');
        document.getElementById('submit-btn').innerText = "Save Transaction"; participants = [...state.people]; 
        document.getElementById('trans-date').value = new Date().toISOString().split('T')[0];
        updateSplitUI();
    }

    function editExpense(id) {
        const e = state.expenses.find(x => x.id === id);
        document.getElementById('edit-id').value = e.id; document.getElementById('desc').value = e.desc; document.getElementById('amount').value = e.amount;
        document.getElementById('payer-select').value = e.payer; document.getElementById('split-mode').value = e.mode;
        document.getElementById('trans-date').value = e.rawDate; participants = e.participants || [...state.people];
        document.getElementById('form-title').innerText = "Edit Entry"; document.getElementById('cancel-edit').classList.remove('hidden');
        updateSplitUI();
        switchTab('setup');
        window.scrollTo({ top: document.getElementById('input-container').offsetTop - 10, behavior: 'smooth' });
    }

    function render() {
        const cur = state.currency;
        document.getElementById('display-group-name').innerText = state.groupName || '';
        document.getElementById('currency-selector').value = cur;
        document.getElementById('currency-symbol-indicator').innerText = cur;
        updateTopBarTitle();
        
        document.getElementById('payer-select').innerHTML = '<option value="">Payer?</option>' + state.people.map(p => `<option value="${p}">${p}</option>`).join('');
        
        let totalSum = state.expenses.reduce((sum, e) => sum + e.amount, 0);
        document.getElementById('total-group-amount').innerText = `${cur}${totalSum.toFixed(2)}`;

        let spentMap = {}; let darkOwedMap = {}; let balances = calculateBalances();
        state.people.forEach(p => { spentMap[p] = 0; darkOwedMap[p] = 0; });
        state.expenses.forEach(e => {
            if (spentMap.hasOwnProperty(e.payer)) spentMap[e.payer] += e.amount;
            Object.entries(e.breakdown).forEach(([name, share]) => { if (darkOwedMap.hasOwnProperty(name)) darkOwedMap[name] += share; });
        });

        const rowsContainer = document.getElementById('member-table-rows');
        if (state.people.length === 0) {
            rowsContainer.innerHTML = `<div class="p-3 text-slate-400 font-bold text-center uppercase text-sm">No members configured</div>`;
        } else {
            rowsContainer.innerHTML = state.people.map(p => {
                const bal = balances[p] || 0;
                const balClass = bal >= 0 ? 'text-emerald-500 font-bold' : 'text-rose-500 font-bold';
                return `
                    <div class="grid grid-cols-[1.3fr_1fr_1fr_1fr] gap-0 py-1.5 items-center text-right text-[11px] font-sans text-slate-600">
                        <span class="text-left font-700 text-dark uppercase px-2 border-r border-slate-100">${p}</span>
                        <span class="px-1 border-r border-slate-100 font-mono">${cur}${spentMap[p].toFixed(2)}</span>
                        <span class="px-1 border-r border-slate-100 font-mono">${cur}${darkOwedMap[p].toFixed(2)}</span>
                        <span class="${balClass} px-2 font-mono">${bal >= 0 ? '+' : '-'}${cur}${Math.abs(bal).toFixed(2)}</span>
                    </div>`;
            }).join('');
        }

        const badgesContainer = document.getElementById('settings-member-badges');
        if (state.people.length === 0) {
            badgesContainer.innerHTML = `<p class="text-[11px] font-bold text-slate-300 uppercase py-1">No members added yet</p>`;
        } else {
            badgesContainer.innerHTML = state.people.map(p => `
                <div class="inline-flex items-center bg-slate-100 text-dark text-[11px] font-700 uppercase tracking-wide px-2.5 py-1 rounded-full gap-1.5 border border-slate-200">
                    <span onclick="editMemberBadge('${p}')" class="cursor-pointer hover:text-primary transition-colors">${p}</span>
                    <button onclick="deleteMemberBadge('${p}')" class="text-slate-400 hover:text-rose-500 font-bold ml-0.5 text-xs select-none">×</button>
                </div>
            `).join('');
        }

        const plan = calculateSettlements(balances);
        document.getElementById('settlement-list').innerHTML = plan.length === 0 ? '<p class="text-center text-[11px] font-700 text-primary uppercase">No Debts</p>' : plan.map(p => `<div class="flex justify-between p-1.5 bg-white rounded-md text-[11px] font-700 text-dark uppercase"><span>${p.from} <span class="text-indigo-200">➜</span> ${p.to}</span><span class="font-mono">${cur}${p.amount.toFixed(2)}</span></div>`).join('');
        
        const history = document.getElementById('transaction-body');
        history.innerHTML = state.expenses.slice().reverse().map(e => `
            <div class="soft-card p-3 cursor-pointer hover:shadow-md transition-all" onclick="toggleRow(${e.id})">
                <div class="flex justify-between items-center"><h4 class="font-800 text-sm text-dark uppercase truncate max-w-[220px]">${e.desc}</h4><span class="font-mono font-700 text-dark text-sm">${cur}${e.amount.toFixed(2)}</span></div>
                <div class="flex justify-between items-center mt-1 text-[10px] font-700 text-slate-400 uppercase">
                    <div>${e.date} • ${e.payer}</div>
                    <div class="flex gap-3" data-html2canvas-ignore>
                        <button onclick="event.stopPropagation(); editExpense(${e.id})" class="text-primary underline">Edit</button>
                        <button onclick="event.stopPropagation(); deleteExpense(${e.id})" class="text-rose-400 underline">Delete</button>
                    </div>
                </div>
                <div class="expandable ${expandedId === e.id ? 'expanded' : ''}">
                    ${Object.entries(e.breakdown).filter(([_, v]) => v !== 0).map(([n, v]) => `<div class="flex justify-between text-[11px] font-700 text-slate-500 uppercase py-0.5"><span>${n}</span><span class="font-mono">${cur}${v.toFixed(2)}</span></div>`).join('')}
                </div>
            </div>`).join('') || '<p class="text-center py-6 text-slate-300 font-800 uppercase text-[11px]">Empty Ledger</p>';
    }

    function toggleRow(id) { expandedId = expandedId === id ? null : id; render(); }
    document.getElementById('trans-date').value = new Date().toISOString().split('T')[0];
    render(); updateSplitUI();
</script>
